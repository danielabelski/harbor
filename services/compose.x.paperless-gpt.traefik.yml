services:
  paperless-gpt:
    environment:
      # "Open in Paperless" links in the UI must point at the hostname the
      # browser can reach, not the container-internal or localhost URL.
      # Lives here rather than in compose.x.traefik.paperless-gpt.yml because
      # that file is regenerated by seed-traefik.ts.
      - PAPERLESS_PUBLIC_URL=https://paperless.${HARBOR_TRAEFIK_DOMAIN}
    labels:
      # paperless-gpt has no login of its own but holds a full-access admin
      # token, so the LAN route is gated by HTTP basic auth.
      - "traefik.http.routers.paperless-gpt.middlewares=paperless-gpt-auth"
      - "traefik.http.middlewares.paperless-gpt-auth.basicauth.users=${HARBOR_PAPERLESS_GPT_TRAEFIK_USERS}"
