services:
  linkwarden:
    environment:
      # NextAuth validates callback URLs against NEXTAUTH_URL, so a login
      # through the traefik hostname must land back on that hostname.
      # Lives here rather than in compose.x.traefik.linkwarden.yml because
      # that file is regenerated by seed-traefik.ts.
      - NEXTAUTH_URL=${HARBOR_LINKWARDEN_PUBLIC_URL:-https://linkwarden.${HARBOR_TRAEFIK_DOMAIN}}/api/v1/auth
