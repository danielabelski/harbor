# Seeded by seed-traefik.ts and extended by hand: the environment block
# below must survive a re-seed.
services:
  linkwarden:
    environment:
      # NextAuth validates callback URLs against NEXTAUTH_URL, so a login
      # through the traefik hostname must land back on that hostname
      - NEXTAUTH_URL=${HARBOR_LINKWARDEN_PUBLIC_URL:-https://linkwarden.${HARBOR_TRAEFIK_DOMAIN}}/api/v1/auth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linkwarden.rule=Host(`linkwarden.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.linkwarden.loadbalancer.server.port=3000"
      - "traefik.http.routers.linkwarden.entrypoints=websecure"
      - "traefik.http.routers.linkwarden.tls=true"
      - "traefik.http.routers.linkwarden.service=linkwarden"

    networks:
      - traefik-public
