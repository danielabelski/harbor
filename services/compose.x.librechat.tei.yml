services:
  librechat-rag:
    depends_on:
      tei:
        condition: service_healthy
    environment:
      # The rag-api "lite" image lacks langchain_huggingface, so the native
      # huggingfacetei provider crashes on import; TEI's OpenAI-compatible
      # /v1/embeddings endpoint works with the openai provider instead
      - EMBEDDINGS_PROVIDER=openai
      - EMBEDDINGS_MODEL=${HARBOR_TEI_MODEL}
      - RAG_OPENAI_BASEURL=http://tei:80/v1
      - RAG_OPENAI_API_KEY=sk-tei
