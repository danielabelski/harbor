services:
  linkwarden:
    container_name: ${HARBOR_CONTAINER_PREFIX}.linkwarden
    image: ${HARBOR_LINKWARDEN_IMAGE}:${HARBOR_LINKWARDEN_VERSION}
    # Harbor services normally omit restart policies, but this image runs the
    # web app and the archive worker under `concurrently -k`: an unhandled
    # worker error (e.g. a browser abort after BROWSER_TIMEOUT) exits the
    # whole container and strands the archive backlog. Same reasoning as
    # karakeep/windmill, which also bundle background workers.
    restart: unless-stopped
    env_file:
      - ./.env
      - ./services/linkwarden/override.env
    # Run as the host user so files written into the workspace stay host-owned
    user: ${HARBOR_USER_ID}:${HARBOR_GROUP_ID}
    ports:
      - ${HARBOR_LINKWARDEN_HOST_PORT}:3000
    environment:
      # Public origin NextAuth redirects to after login; an https value also
      # switches Linkwarden to __Secure- cookies, so it must match how the
      # browser actually reaches the app
      - NEXTAUTH_URL=${HARBOR_LINKWARDEN_PUBLIC_URL:-http://localhost:${HARBOR_LINKWARDEN_HOST_PORT}}/api/v1/auth
      - NEXTAUTH_SECRET=${HARBOR_LINKWARDEN_NEXTAUTH_SECRET}
      - DATABASE_URL=postgresql://postgres:${HARBOR_LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/postgres
      - MEILI_HOST=http://linkwarden-meili:7700
      - MEILI_MASTER_KEY=${HARBOR_LINKWARDEN_MEILI_MASTER_KEY}
      # Harbor services live on a private docker network; allow archiving them
      - ALLOW_PRIVATE_NETWORK_ACCESS=${HARBOR_LINKWARDEN_ALLOW_PRIVATE_NETWORK_ACCESS}
      # Archive worker tuning: links processed per batch and the per-link
      # headless browser timeout in minutes
      - ARCHIVE_TAKE_COUNT=${HARBOR_LINKWARDEN_ARCHIVE_TAKE_COUNT}
      - BROWSER_TIMEOUT=${HARBOR_LINKWARDEN_BROWSER_TIMEOUT}
    volumes:
      - ${HARBOR_LINKWARDEN_WORKSPACE}/data:/data/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/v1/public/users/1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      # Prisma migrations run at startup; wait for the DB and search index
      # to actually accept connections on cold start
      linkwarden-db:
        condition: service_healthy
      linkwarden-meili:
        condition: service_healthy
      linkwarden-init:
        condition: service_completed_successfully
    networks:
      - harbor-network

  linkwarden-db:
    container_name: ${HARBOR_CONTAINER_PREFIX}.linkwarden-db
    env_file:
      - ./.env
    image: ${HARBOR_LINKWARDEN_DB_IMAGE}:${HARBOR_LINKWARDEN_DB_VERSION}
    # Sidecars share the main container's policy so a restarted linkwarden
    # never comes back to a missing database or search index
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${HARBOR_LINKWARDEN_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ${HARBOR_LINKWARDEN_WORKSPACE}/pgdata:/var/lib/postgresql/data
    networks:
      - harbor-network

  linkwarden-meili:
    container_name: ${HARBOR_CONTAINER_PREFIX}.linkwarden-meili
    env_file:
      - ./.env
    image: ${HARBOR_LINKWARDEN_MEILI_IMAGE}:${HARBOR_LINKWARDEN_MEILI_VERSION}
    restart: unless-stopped
    # Host user so the index directory stays manageable without sudo
    user: ${HARBOR_USER_ID}:${HARBOR_GROUP_ID}
    environment:
      - MEILI_MASTER_KEY=${HARBOR_LINKWARDEN_MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ${HARBOR_LINKWARDEN_WORKSPACE}/meili:/meili_data
    depends_on:
      linkwarden-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - harbor-network

  linkwarden-init:
    container_name: ${HARBOR_CONTAINER_PREFIX}.linkwarden-init
    image: alpine:3.20
    env_file:
      - ./.env
      - ./services/linkwarden/override.env
    environment:
      TARGET_UID: ${HARBOR_USER_ID}
      TARGET_GID: ${HARBOR_GROUP_ID}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./services/linkwarden/workspace-init.sh:/init.sh:ro
      - ${HARBOR_LINKWARDEN_WORKSPACE}/data:/workspace/data
      - ${HARBOR_LINKWARDEN_WORKSPACE}/meili:/workspace/meili
    networks:
      - harbor-network
