# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  paperless-gpt:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless-gpt.rule=Host(`paperless-gpt.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.paperless-gpt.loadbalancer.server.port=8080"
      - "traefik.http.routers.paperless-gpt.entrypoints=websecure"
      - "traefik.http.routers.paperless-gpt.tls=true"
      - "traefik.http.routers.paperless-gpt.service=paperless-gpt"

    networks:
      - traefik-public
