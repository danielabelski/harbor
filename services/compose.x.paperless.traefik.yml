services:
  paperless:
    environment:
      # Django rejects POSTs (login included) whose Origin is not derived from
      # PAPERLESS_URL, so a login through the traefik hostname must be trusted.
      # Lives here rather than in compose.x.traefik.paperless.yml because
      # that file is regenerated by seed-traefik.ts.
      - PAPERLESS_URL=https://paperless.${HARBOR_TRAEFIK_DOMAIN}
      # Keep the plain host-port URL trusted as well
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=${HARBOR_PAPERLESS_URL}
